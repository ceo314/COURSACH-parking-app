<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Автомобили на парковке</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Автомобили на парковке (Вариант 7)</h2>
        <div>
            <a th:href="@{/models}" class="btn btn-outline-info me-2">Справочник моделей</a>
            <a th:href="@{/logout}" class="btn btn-outline-danger">Выйти</a>
        </div>
    </div>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Гос. номер</th>
            <th>Место</th>
            <th>Марка / Модель</th>
            <th>Тариф (руб/ч)</th>
            <th>Время въезда</th>
            <th sec:authorize="hasAnyRole('USER', 'ADMIN')">Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="auto : ${automobiles}">
            <td th:text="${auto.id}"></td>
            <td th:text="${auto.licensePlate}"></td>
            <td th:text="${auto.parkingSpot}"></td>
            <td th:text="${auto.carModel.brand + ' ' + auto.carModel.modelName}"></td>
            <td th:text="${auto.carModel.rentalRate}"></td>
            <td th:text="${#temporals.format(auto.entryTime, 'dd.MM.yyyy HH:mm')}"></td>
            <td sec:authorize="hasAnyRole('USER', 'ADMIN')">
                <a th:href="@{/automobiles/edit/{id}(id=${auto.id})}" class="btn btn-sm btn-warning">Ред.</a>
                <a th:href="@{/automobiles/delete/{id}(id=${auto.id})}" class="btn btn-sm btn-danger">Удал.</a>
            </td>
        </tr>
        </tbody>
    </table>

    <div sec:authorize="hasAnyRole('USER', 'ADMIN')" class="card p-4 mt-4 shadow-sm">
        <h4>Добавить автомобиль на парковку</h4>
        <form th:action="@{/automobiles/add}" th:object="${newAutomobile}" method="post" class="row g-3">
            <div class="col-md-4">
                <input type="text" th:field="*{licensePlate}" class="form-control" placeholder="Гос. номер" required>
            </div>
            <div class="col-md-4">
                <input type="text" th:field="*{parkingSpot}" class="form-control" placeholder="Парковочное место" required>
            </div>
            <div class="col-md-4">
                <select th:field="*{carModel.id}" class="form-select" required>
                    <option value="" disabled selected>Выберите модель</option>
                    <option th:each="m : ${models}" th:value="${m.id}" th:text="${m.brand + ' ' + m.modelName + ' (' + m.rentalRate + ' руб/ч)'}"></option>
                </select>
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-primary">Зарегистрировать въезд</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
