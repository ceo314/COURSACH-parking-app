<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Справочник моделей</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Справочник моделей и стоимости (Вариант 7)</h2>
        <a th:href="@{/automobiles}" class="btn btn-outline-secondary">К списку автомобилей</a>
    </div>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Марка</th>
            <th>Модель</th>
            <th>Тип кузова</th>
            <th>Тариф (руб/ч)</th>
            <th sec:authorize="hasAnyRole('USER', 'ADMIN')">Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="m : ${carModels}">
            <td th:text="${m.id}"></td>
            <td th:text="${m.brand}"></td>
            <td th:text="${m.modelName}"></td>
            <td th:text="${m.bodyType}"></td>
            <td th:text="${m.rentalRate}"></td>
            <td sec:authorize="hasAnyRole('USER', 'ADMIN')">
                <a th:href="@{/models/edit/{id}(id=${m.id})}" class="btn btn-sm btn-warning">Ред.</a>
                <a th:href="@{/models/delete/{id}(id=${m.id})}" class="btn btn-sm btn-danger">Удал.</a>
            </td>
        </tr>
        </tbody>
    </table>

    <div sec:authorize="hasAnyRole('USER', 'ADMIN')" class="card p-4 mt-4 shadow-sm">
        <h4>Добавить новую модель</h4>
        <form th:action="@{/models/add}" th:object="${newModel}" method="post" class="row g-3">
            <div class="col-md-3">
                <input type="text" th:field="*{brand}" class="form-control" placeholder="Марка" required>
            </div>
            <div class="col-md-3">
                <input type="text" th:field="*{modelName}" class="form-control" placeholder="Модель" required>
            </div>
            <div class="col-md-3">
                <input type="text" th:field="*{bodyType}" class="form-control" placeholder="Тип кузова">
            </div>
            <div class="col-md-3">
                <input type="number" step="0.1" th:field="*{rentalRate}" class="form-control" placeholder="Тариф (руб/ч)" required>
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-success">Сохранить модель</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
