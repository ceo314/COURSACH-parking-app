<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Редактирование модели</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 500px;">
    <h3>Редактирование модели</h3>
    <form th:action="@{/models/edit/{id}(id=${carModel.id})}" th:object="${carModel}" method="post" class="card p-4 shadow-sm">
        <div class="mb-3">
            <label class="form-label">Марка</label>
            <input type="text" th:field="*{brand}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Модель</label>
            <input type="text" th:field="*{modelName}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Тип кузова</label>
            <input type="text" th:field="*{bodyType}" class="form-control">
        </div>
        <div class="mb-3">
            <label class="form-label">Тариф (руб/ч)</label>
            <input type="number" step="0.1" th:field="*{rentalRate}" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a th:href="@{/models}" class="btn btn-secondary mt-2">Отмена</a>
    </form>
</div>
</body>
</html>
